<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b45">
<title>Ціни Оболонь</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17251e;background:#f4f7f4}
*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}
header{background:#176b45;color:white;padding:22px 18px 20px;border-radius:0 0 22px 22px}
h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#e1f2e7;font-size:14px}
main{padding:18px}.search{width:100%;padding:13px 14px;border:1px solid #d7e1da;border-radius:12px;font:inherit;margin-bottom:14px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.filter{white-space:nowrap;border:1px solid #d7e1da;background:white;border-radius:20px;padding:8px 12px;font:inherit;font-size:13px}.filter.active{background:#176b45;color:white;border-color:#176b45}
h2{font-size:17px;margin:14px 0 10px}.product{border:1px solid #e2e9e4;border-radius:14px;padding:13px;margin-bottom:10px}
.prodtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.prodname{font-weight:650}.unit{color:#718077;font-size:12px}
.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.store{background:#f4f7f4;border-radius:10px;padding:9px 7px;text-align:center;font-size:12px}.store b{display:block;font-size:14px;margin-top:4px}.pending{color:#718077;font-size:11px;margin-top:9px}
.note{font-size:12px;color:#64746a;line-height:1.45;padding:12px;background:#f4f7f4;border-radius:12px;margin-top:16px}
.empty{padding:22px;text-align:center;color:#64746a}
</style>
</head>
<body><div class="app">
<header><h1>Ціни Оболонь</h1><p>Порівнюйте ціни в магазинах Оболонського району</p></header>
<main>
<input class="search" id="search" placeholder="Пошук товарів…" aria-label="Пошук товарів">
<div class="filters" id="filters"></div>
<h2>Товари</h2><div id="products"></div>
<div class="note">Це тестовий макет. Ціни поки не підключені до магазинів і не є актуальними. Після підключення джерел тут відображатимуться перевірені ціни, магазин і час оновлення.</div>
</main></div>
<script>
const items=[
["Гречка","Крупи","кг"],["Рис","Крупи","кг"],["Вівсянка","Крупи","кг"],["Пшоно","Крупи","кг"],["Перлова крупа","Крупи","кг"],["Манна крупа","Крупи","кг"],
["Цукор","Бакалія","кг"],["Сіль","Бакалія","кг"],["Борошно","Бакалія","кг"],["Макарони","Бакалія","кг"],["Олія соняшникова","Бакалія","л"],
["Яйця","Молочні продукти та яйця","10 шт."],["Молоко","Молочні продукти та яйця","л"],["Масло вершкове","Молочні продукти та яйця","200 г"],
["Хліб","Хліб","шт."],["Картопля","Овочі та фрукти","кг"],["Цибуля","Овочі та фрукти","кг"],["Морква","Овочі та фрукти","кг"],["Капуста","Овочі та фрукти","кг"],["Яблука","Овочі та фрукти","кг"]
];
const cats=["Усі категорії",...new Set(items.map(x=>x[1]))];let category=cats[0];
const filters=document.getElementById("filters"),products=document.getElementById("products"),search=document.getElementById("search");
function renderFilters(){filters.innerHTML="";cats.forEach(c=>{const b=document.createElement("button");b.className="filter"+(c===category?" active":"");b.textContent=c;b.onclick=()=>{category=c;renderFilters();renderProducts()};filters.appendChild(b)})}
function renderProducts(){const q=search.value.trim().toLocaleLowerCase("uk");const filtered=items.filter(x=>(category===cats[0]||x[1]===category)&&x[0].toLocaleLowerCase("uk").includes(q));products.innerHTML="";if(!filtered.length){products.innerHTML='<div class="empty">Товарів не знайдено</div>';return}
filtered.forEach(x=>{const el=document.createElement("section");el.className="product";el.innerHTML=`<div class="prodtop"><span class="prodname">${x[0]}</span><span class="unit">${x[2]}</span></div><div class="pricegrid"><div class="store">АТБ<b>— ₴</b></div><div class="store">NOVUS<b>— ₴</b></div><div class="store">Сільпо<b>— ₴</b></div></div><div class="pending">Ціна ще не перевірена</div>`;products.appendChild(el)})}
search.addEventListener("input",renderProducts);renderFilters();renderProducts();
</script>
</body></html>
